name: kompas

x-api: &api
  build:
    context: ../backend
  environment:
    KOMPAS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-kompas}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-kompas}
    KOMPAS_CORS_ORIGINS: ${KOMPAS_CORS_ORIGINS:-[]}
    KOMPAS_SUPABASE_URL: ${KOMPAS_SUPABASE_URL:-}
    KOMPAS_JWT_ALGORITHM: ${KOMPAS_JWT_ALGORITHM:-ES256}
    KOMPAS_STORAGE_ENDPOINT: http://rustfs:9000
    KOMPAS_STORAGE_BUCKET: ${KOMPAS_STORAGE_BUCKET:-kompas-private}
    KOMPAS_STORAGE_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?Set RUSTFS_ACCESS_KEY}
    KOMPAS_STORAGE_SECRET_KEY: ${RUSTFS_SECRET_KEY:?Set RUSTFS_SECRET_KEY}
    KOMPAS_LLM_PROVIDER: ${KOMPAS_LLM_PROVIDER:-openrouter}
    KOMPAS_LLM_MODEL: ${KOMPAS_LLM_MODEL:-anthropic/claude-sonnet-5.5}
    KOMPAS_LLM_API_KEY: ${KOMPAS_LLM_API_KEY:-}
    KOMPAS_LLM_BASE_URL: ${KOMPAS_LLM_BASE_URL:-https://openrouter.ai/api/v1}
    KOMPAS_LLM_TIMEOUT_SECONDS: ${KOMPAS_LLM_TIMEOUT_SECONDS:-60}
    KOMPAS_LLM_MAX_TOKENS: ${KOMPAS_LLM_MAX_TOKENS:-8192}
    KOMPAS_LLM_REASONING_EFFORT: ${KOMPAS_LLM_REASONING_EFFORT:-medium}

services:
  db:
    image: postgres:17.7-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kompas}
      POSTGRES_DB: ${POSTGRES_DB:-kompas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12

  migrate:
    <<: *api
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    <<: *api
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=7)"]
      interval: 10s
      timeout: 8s
      retries: 6

  frontend:
    build:
      context: ../frontend
    environment:
      API_BASE_URL: http://backend:8000
      KOMPAS_SUPABASE_URL: ${KOMPAS_SUPABASE_URL:-}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
    depends_on:
      backend:
        condition: service_healthy

  storage-init:
    <<: *api
    command: ["python", "-m", "app.integrations.storage"]
    depends_on:
      rustfs:
        condition: service_healthy
    restart: "no"

  rustfs:
    image: rustfs/rustfs:1.0.6
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?Set RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?Set RUSTFS_SECRET_KEY}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: error
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  postgres-data:
  rustfs-data:
